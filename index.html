<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasinda C. Prabhashana || PhD Candidate</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500&display=swap" rel="stylesheet">

<!-- Apply the visitor's saved light/dark choice before the page draws (prevents a flash) -->
<script>
  try { if (localStorage.getItem("scp-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>

<style>
  /* DARK THEME (default): deep teal */
  :root {
    --navy: #04191c;
    --navy-mid: #0a2a2f;
    --navy-light: #113a40;
    --teal: #00b4d8;
    --teal-light: #48cae4;
    --gold: #f4a732;
    --gold-light: #ffd166;
    --purple: #a78bfa;
    --green: #34d399;
    --text-main: #e8eaf0;
    --text-muted: #8b9ab5;
    --text-soft: #c5cedd;
    --border: rgba(0,180,216,0.15);
    --card: rgba(12,44,50,0.66);
    --nav-bg: rgba(4,25,28,0.93);
    --name-start: #ffffff;
    --probe: #ff6b81;
    --shadow-hover: 0 14px 34px rgba(0,0,0,0.35);
    --ease: cubic-bezier(.2,.7,.2,1);
    --nav-shadow: 0 10px 30px rgba(0,0,0,0.35);
    --spot-rgb: 0,180,216;
    --radius: 12px;
    color-scheme: dark;
  }
  /* LIGHT THEME: white background, black text (turned on by the switch in the top menu) */
  :root[data-theme="light"] {
    --navy: #ffffff;
    --navy-mid: #eef2f7;
    --navy-light: #e2e8f0;
    --teal: #0077a0;
    --teal-light: #00658a;
    --gold: #a35f00;
    --gold-light: #c77700;
    --purple: #6941c6;
    --green: #047857;
    --text-main: #0b0f19;
    --text-muted: #4a5566;
    --text-soft: #1f2733;
    --border: rgba(0,90,130,0.18);
    --card: #f6f8fb;
    --nav-bg: rgba(255,255,255,0.92);
    --name-start: #0b0f19;
    --probe: #d6334f;
    --shadow-hover: 0 14px 34px rgba(15,30,45,0.10);
    --nav-shadow: 0 8px 24px rgba(15,30,45,0.08);
    --spot-rgb: 0,119,160;
    color-scheme: light;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--text-main); min-height:100vh; overflow-x:hidden; transition:background-color 0.3s ease, color 0.3s ease; }
  body::before {
    content:''; position:fixed; inset:-35vh 0; pointer-events:none; z-index:0;
    transform:translate3d(0, calc(var(--py, 0) * -1px), 0); will-change:transform;
    background:
      radial-gradient(ellipse 80% 35% at 20% 27%, rgba(0,180,216,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 80% 65%, rgba(244,167,50,0.05) 0%, transparent 60%);
  }

  /* Moving network of satellite nodes behind every page (drawn by setupNetworkBg) */
  #bg-net { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  /* NAV */
  nav { position:sticky; top:0; z-index:100; background:var(--nav-bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 2rem; transition:background-color 0.3s ease, box-shadow 0.4s ease; }
  nav.scrolled { box-shadow:var(--nav-shadow); }
  .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; }
  .nav-logo { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--teal); padding:1rem 1.1rem 1rem 0; white-space:nowrap; border-right:1px solid var(--border); margin-right:0.6rem; flex-shrink:0; }
  .nav-tabs { display:flex; list-style:none; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .nav-tabs::-webkit-scrollbar { display:none; }

  /* LIGHT / DARK SWITCH */
  .theme-switch { flex-shrink:0; margin-left:auto; padding:0.5rem 0 0.5rem 1rem; background:none; border:none; cursor:pointer; display:inline-flex; align-items:center; }
  .theme-switch:focus-visible { outline:none; }
  .theme-switch:focus-visible .switch-track { outline:2px solid var(--teal); outline-offset:3px; }
  .switch-track { position:relative; display:block; width:50px; height:26px; border-radius:100px; background:var(--navy-mid); border:1px solid var(--border); transition:background-color 0.3s, border-color 0.3s; }
  .theme-switch:hover .switch-track { border-color:var(--teal); }
  .track-icon { position:absolute; top:50%; width:12px; height:12px; margin-top:-6px; color:var(--text-muted); opacity:0.75; }
  .track-moon { left:6px; }
  .track-sun  { right:6px; }
  .switch-knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--teal); color:var(--navy); display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.3); transition:transform 0.3s ease, background-color 0.3s; z-index:1; }
  .switch-knob svg { width:12px; height:12px; }
  .knob-sun { display:none; }
  :root[data-theme="light"] .switch-knob { transform:translateX(24px); background:var(--gold); }
  :root[data-theme="light"] .knob-sun  { display:block; }
  :root[data-theme="light"] .knob-moon { display:none; }
  .nav-tab { padding:1rem 0.8rem; cursor:pointer; font-size:0.78rem; font-weight:500; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); border-bottom:2px solid transparent; transition:all 0.25s; white-space:nowrap; flex-shrink:0; }
  .nav-tab:hover { color:var(--teal-light); }
  .nav-tab.active { color:var(--teal); border-bottom-color:var(--teal); background:rgba(0,180,216,0.05); }
  .nav-tabs { position:relative; }
  .has-indicator .nav-tab.active { border-bottom-color:transparent; }
  .nav-indicator { position:absolute; left:0; bottom:0; height:2px; width:0; border-radius:2px; background:var(--teal); box-shadow:0 0 10px var(--teal); pointer-events:none; transition:transform 0.5s var(--ease), width 0.5s var(--ease); }

  /* PAGES */
  .page { display:none; position:relative; z-index:1; }
  .page.active { display:block; animation:pageIn 0.75s var(--ease); }
  @keyframes pageIn { from { opacity:0; transform:translateY(18px); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }

  /* SCROLL REVEAL: content glides in as it comes into view */
  .has-reveal .reveal { opacity:0; translate:0 26px; transition:opacity 0.8s var(--ease) var(--d,0ms), translate 0.8s var(--ease) var(--d,0ms), transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, color 0.2s ease; }
  .has-reveal .reveal.in { opacity:1; translate:0 0; }

  /* Soft lift on hover */

  /* Circular wipe when switching light/dark (browsers that support it) */
  ::view-transition-old(root), ::view-transition-new(root) { animation:none; mix-blend-mode:normal; }
  .container { max-width:1200px; margin:0 auto; padding:3rem 2rem; }

  /* ABOUT */
  .about-hero { display:grid; grid-template-columns:280px 1fr; gap:3rem; margin-bottom:3.5rem; align-items:start; }
  .photo-col { display:flex; flex-direction:column; align-items:center; gap:1.2rem; }
  .photo-frame { position:relative; width:220px; height:220px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--gold)); padding:3px; flex-shrink:0; }
  .photo-inner { width:100%; height:100%; border-radius:50%; background:var(--navy-mid); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .photo-inner img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .photo-placeholder { font-size:5rem; opacity:0.3; }

  /* SIDE PANEL: lab card, email button, local time, link buttons */
  .sp-lab { width:100%; text-align:center; padding:1.1rem; border-radius:18px; border:1px solid rgba(var(--spot-rgb),0.3); background:linear-gradient(135deg,rgba(0,180,216,0.14),rgba(244,167,50,0.08)); }
  .sp-lab-n { font:700 0.82rem 'DM Sans',sans-serif; color:var(--gold); line-height:1.4; }
  .sp-lab-s { font-size:0.72rem; color:var(--text-muted); margin-top:0.2rem; }
  .sp-chips { display:flex; flex-direction:column; align-items:center; gap:0.45rem; margin-top:0.75rem; }
  .sp-chip { display:inline-flex; align-items:center; gap:0.35rem; font:600 0.74rem 'DM Sans',sans-serif; color:var(--teal-light); text-decoration:none; padding:0.35rem 0.85rem; border-radius:100px; border:1px solid rgba(var(--spot-rgb),0.35); background:rgba(var(--spot-rgb),0.08); transition:background-color 0.25s, border-color 0.25s, transform 0.25s var(--ease); }
  .sp-chip:hover { background:rgba(var(--spot-rgb),0.18); border-color:var(--teal); transform:translateY(-2px); }
  .sp-mail { width:100%; display:flex; gap:0.5rem; }
  .sp-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.8rem 1rem; border-radius:14px; font:600 0.88rem 'DM Sans',sans-serif; color:var(--navy); background:linear-gradient(135deg,var(--teal),var(--teal-light)); text-decoration:none; box-shadow:0 8px 22px rgba(var(--spot-rgb),0.3); transition:transform 0.25s var(--ease), box-shadow 0.25s; }
  .sp-btn:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(var(--spot-rgb),0.4); }
  .sp-cp { position:relative; width:48px; flex-shrink:0; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--text-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color 0.25s, color 0.25s; }
  .sp-cp:hover { border-color:var(--teal); color:var(--teal-light); }
  .sp-cp .ok { display:none; }
  .sp-cp.done { border-color:var(--green); color:var(--green); }
  .sp-cp.done .ok { display:block; } .sp-cp.done .cp { display:none; }
  .sp-cp::after { content:'Copied!'; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translate(-50%,4px); white-space:nowrap; font:600 0.68rem 'DM Sans',sans-serif; color:var(--navy); background:var(--green); padding:0.2rem 0.5rem; border-radius:6px; opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; }
  .sp-cp.done::after { opacity:1; transform:translate(-50%,0); }
  .sp-cp:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  .sp-loc { width:100%; display:flex; align-items:center; gap:0.45rem; font-size:0.78rem; color:var(--text-muted); padding:0 0.3rem; }
  .sp-loc svg { color:var(--teal); flex-shrink:0; }
  .sp-time { margin-left:auto; font:500 0.72rem 'DM Mono',monospace; color:var(--text-soft); white-space:nowrap; }
  .sp-h { width:100%; font:600 0.7rem 'DM Sans',sans-serif; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal); margin:0.4rem 0 -0.4rem 0.6rem; }
  .sp-links { width:100%; display:flex; flex-direction:column; gap:0.6rem; }
  .sp-link { display:flex; align-items:center; gap:0.75rem; padding:0.7rem 0.9rem; border-radius:14px; border:1px solid var(--border); background-color:var(--card); color:var(--text-main); text-decoration:none; font:600 0.86rem 'DM Sans',sans-serif; }
  .sp-link .ic { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; background:var(--b); flex-shrink:0; }
  .sp-link .ic svg { width:15px; height:15px; }
  .sp-link .go { margin-left:auto; color:var(--text-muted); display:flex; transition:transform 0.3s var(--ease), color 0.3s; }
  .sp-link:hover { border-color:var(--b); transform:translateX(4px); box-shadow:0 6px 18px color-mix(in srgb, var(--b) 25%, transparent); }
  .sp-link:hover .go { color:var(--text-main); transform:translate(2px,-2px); }

  .intro-greeting { font-family:'DM Mono','Noto Sans Sinhala',monospace; font-size:0.85rem; color:var(--teal); letter-spacing:0.05em; margin-bottom:0.5rem; opacity:0.8; }
  .intro-name { font-family:'Playfair Display',serif; font-size:3rem; font-weight:700; line-height:1.1; margin-bottom:0.5rem; background:linear-gradient(135deg,var(--name-start) 30%,var(--teal-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .intro-title { font-size:1rem; color:var(--gold); font-weight:500; margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; }
  .intro-bio { font-size:1rem; line-height:1.8; color:var(--text-soft); margin-bottom:1.2rem; }
  .intro-bio strong { color:var(--text-main); font-weight:600; }
  .research-tags { display:flex; flex-wrap:wrap; gap:0.6rem; margin-bottom:1.5rem; }
  .tag { background:rgba(0,180,216,0.1); border:1px solid rgba(0,180,216,0.25); color:var(--teal-light); padding:0.35rem 0.85rem; border-radius:100px; font-size:0.78rem; font-weight:500; transition:all 0.2s; }
  .tag:hover { background:rgba(0,180,216,0.2); border-color:var(--teal); }
  .stat-row { display:flex; gap:2rem; flex-wrap:wrap; }
  .stat-item { text-align:center; }
  .stat-num { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:var(--teal); line-height:1; }
  .stat-label { font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:0.25rem; }

  /* SECTION TITLE */
  .section-title { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:600; color:var(--text-main); margin-bottom:1.5rem; display:flex; align-items:center; gap:1rem; }
  .section-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent); }

  /* EDUCATION: rows with a GPA meter */
  .eb { margin-bottom:3rem; }
  .eb-row { display:grid; grid-template-columns:170px 1fr 300px; gap:1.6rem; align-items:center; padding:1.3rem 0.4rem; border-bottom:1px solid var(--border); }
  .eb > .eb-row:first-child { border-top:1px solid var(--border); }
  .eb-per { font:500 0.76rem 'DM Mono',monospace; color:var(--teal); }
  .eb-deg { font-weight:700; font-size:1.02rem; color:var(--text-main); }
  .eb-uni { font-size:0.84rem; color:var(--teal-light); margin:0.15rem 0 0.4rem; }
  .eb-ex { font-size:0.82rem; color:var(--text-soft); line-height:1.6; }
  .eb-ex div::before { content:'› '; color:var(--teal); }
  .eb-medal { display:inline-flex; align-items:center; gap:0.4rem; margin-top:0.6rem; font:600 0.74rem 'DM Sans',sans-serif; color:var(--navy); background:linear-gradient(135deg,var(--gold),var(--gold-light)); padding:0.3rem 0.7rem; border-radius:100px; box-shadow:0 4px 16px rgba(244,167,50,0.3); }
  .eb-g-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.45rem; }
  .eb-g-l { font:600 0.7rem 'DM Sans',sans-serif; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); }
  .eb-g-v { font:700 1.35rem 'DM Sans',sans-serif; color:var(--text-main); }
  .eb-g-v small { font:500 0.78rem 'DM Mono',monospace; color:var(--text-muted); }
  .eb-bar { height:10px; border-radius:10px; background:rgba(var(--spot-rgb),0.12); overflow:hidden; }
  .eb-bar i { display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--teal),var(--teal-light)); box-shadow:0 0 12px rgba(var(--spot-rgb),0.5); transform-origin:left; transition:transform 1.3s var(--ease) 0.25s; }
  .has-reveal .eb-row:not(.in) .eb-bar i { transform:scaleX(0); }   /* bar fills up as the row scrolls into view */
  @media (max-width:768px) {
    .eb-row { grid-template-columns:1fr; gap:0.7rem; }
  }

  /* NEWS: live ticker band + newsroom list grouped by year */
  .nk-band { display:flex; align-items:center; border:1px solid var(--border); border-radius:100px; overflow:hidden; background:rgba(0,180,216,0.05); margin-bottom:2.2rem; }
  .nk-label { flex-shrink:0; display:flex; align-items:center; gap:0.5rem; padding:0.7rem 1.2rem; background:var(--teal); color:var(--navy); font:600 0.75rem 'DM Mono',monospace; letter-spacing:0.12em; }
  .nk-label i { width:7px; height:7px; border-radius:50%; background:var(--navy); animation:nk-blink 1.2s infinite; }
  @keyframes nk-blink { 50% { opacity:0.2; } }
  .nk-view { overflow:hidden; flex:1; -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent); mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent); }
  .nk-track { display:flex; width:max-content; animation:nk-scroll var(--nk-dur,90s) linear infinite; }
  .nk-band:hover .nk-track { animation-play-state:paused; }
  @keyframes nk-scroll { to { transform:translateX(-50%); } }
  .nk-item { white-space:nowrap; padding:0.7rem 1.6rem; font-size:0.88rem; color:var(--text-soft); }
  .nk-item b { font-family:'DM Mono',monospace; font-weight:500; color:var(--gold); margin-right:0.6rem; font-size:0.78rem; }
  .nk-item strong { color:var(--text-main); }
  .nk-sep { color:var(--teal); opacity:0.6; padding:0.7rem 0; font-size:0.7rem; align-self:center; }
  .nl { display:flex; flex-direction:column; gap:2.4rem; }
  .nl-group { display:grid; grid-template-columns:170px 1fr; gap:2rem; }
  .nl-year { font-family:'Playfair Display',serif; font-size:2.6rem; font-weight:700; line-height:1; color:var(--teal); position:sticky; top:84px; align-self:start; }
  .nl-row { display:grid; grid-template-columns:60px 1fr; gap:1rem; align-items:baseline; padding:1rem 0.6rem; border-bottom:1px solid var(--border); }
  .nl-rows > .nl-row:first-child { border-top:1px solid var(--border); }
  .nl-row:hover { background-color:rgba(0,180,216,0.05); }
  .nl-month { font-family:'DM Mono',monospace; font-size:0.78rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.08em; }
  .nl-text { font-size:0.95rem; line-height:1.6; color:var(--text-soft); transition:transform 0.35s var(--ease); }
  .nl-row:hover .nl-text { transform:translateX(6px); }
  .nl-text strong { color:var(--text-main); }
  .nl-text a, .nk-item a { color:inherit; text-decoration:none; border-bottom:1px solid rgba(var(--spot-rgb),0.5); transition:color 0.2s, border-color 0.2s; }
  .nl-text a:hover, .nk-item a:hover { color:var(--teal-light); border-color:var(--teal-light); }
  .nl-text a strong, .nk-item a strong { color:inherit; }
  .nl-text a:hover strong, .nk-item a:hover strong { color:var(--teal-light); }
  @media (max-width:768px) {
    .nl-group { grid-template-columns:1fr; gap:0.8rem; }
    .nl-year { position:static; font-size:2rem; }
    .nk-label { padding:0.7rem 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nk-track { animation:none; }
    .nk-view { overflow-x:auto; }
  }

  /* EXPERIENCE: expandable timeline */
  .ad { position:relative; margin-bottom:2.6rem; }
  .ad::before { content:''; position:absolute; left:178px; top:0; bottom:0; width:2px; background:linear-gradient(180deg,var(--teal),var(--gold),transparent); opacity:0.6; }
  .ad-row { border-bottom:1px solid var(--border); border-radius:12px; transition:background-color 0.3s ease; }
  .ad-row:hover { background-color:rgba(var(--spot-rgb),0.04); }
  .ad-head { all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:grid; grid-template-columns:160px 38px 1fr 34px; align-items:start; padding:1.05rem 0; }
  .ad-head:focus-visible { outline:2px solid var(--teal); outline-offset:2px; border-radius:10px; }
  .ad-p { font-family:'DM Mono',monospace; font-size:0.76rem; color:var(--teal); text-align:right; padding-top:0.22rem; }
  .ad-p-m { display:none; }
  .ad-dot { justify-self:center; margin-top:0.38rem; width:12px; height:12px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px var(--navy), 0 0 10px var(--gold); position:relative; z-index:1; }
  .ad-r { font-weight:600; font-size:0.98rem; color:var(--text-main); display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; }
  .ad-now { font:600 0.62rem 'DM Mono',monospace; letter-spacing:0.12em; color:var(--navy); background:var(--teal); padding:0.15rem 0.5rem; border-radius:100px; display:inline-flex; align-items:center; gap:0.35rem; }
  .ad-now::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--navy); animation:nk-blink 1.4s infinite; }
  .ad-o { display:block; font-size:0.8rem; color:var(--gold); margin-top:0.22rem; line-height:1.45; }
  .ad-c { justify-self:center; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:1rem; line-height:1; transition:transform 0.4s var(--ease), color 0.3s, border-color 0.3s, background-color 0.3s; }
  .ad-head:hover .ad-c { border-color:var(--teal); color:var(--teal); }
  .ad-row.open .ad-c { transform:rotate(45deg); color:var(--teal); border-color:var(--teal); background-color:rgba(var(--spot-rgb),0.08); }
  /* Smooth open/close: the details grow from zero height */
  .ad-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows 0.5s var(--ease); }
  .ad-row.open .ad-body { grid-template-rows:1fr; }
  .ad-body > div { overflow:hidden; }

  /* ===== TALKS: world map + list ===== */
  .mp { position:relative; border-radius:24px; border:1px solid var(--border); background:radial-gradient(ellipse at 50% 35%, rgba(var(--spot-rgb),0.10), transparent 70%), var(--card); padding:1.4rem 1.4rem 1.2rem; margin-bottom:1.6rem; }

  .mp-k { font:800 1.3rem 'DM Sans',sans-serif; letter-spacing:-0.01em; color:var(--text-main); }
  .mp-hint { font-size:0.78rem; color:var(--text-muted); margin-top:0.25rem; }
  .mp-stats { display:flex; gap:1.8rem; }
  .mp-stats div { min-width:2.6rem; }
  .mp-stats b { display:block; font:800 1.7rem 'DM Sans',sans-serif; line-height:1; color:var(--text-main); font-variant-numeric:tabular-nums; }
  .mp-stats .g b { color:var(--gold); }
  .mp-stats span { display:block; font:600 0.62rem 'DM Sans',sans-serif; letter-spacing:0.13em; text-transform:uppercase; color:var(--text-muted); margin-top:0.4rem; }
  .mp-stage { position:relative; }
  .mp-stage svg { display:block; width:100%; height:auto; overflow:visible; }
  .mp-dots { fill:none; stroke:var(--text-muted); stroke-opacity:0.3; stroke-width:3.4; stroke-linecap:round; }
  .mp-arc { fill:none; stroke:var(--teal-light); stroke-width:1.4; stroke-opacity:0.5; stroke-dasharray:100; stroke-dashoffset:0; transition:stroke-dashoffset 1.6s var(--ease) calc(var(--i) * 140ms + 350ms), stroke-opacity 0.4s ease, stroke 0.4s ease; }
  .has-reveal .mp:not(.in) .mp-arc { stroke-dashoffset:100; }
  .mp-flow { fill:none; stroke:var(--teal-light); stroke-width:2.6; stroke-linecap:round; stroke-dasharray:7 200; stroke-dashoffset:7; opacity:0; filter:drop-shadow(0 0 4px var(--teal-light)); }
  .mp.picked .mp-arc { stroke-opacity:0.12; }
  .mp.picked .mp-arc.on { stroke:var(--gold); stroke-opacity:0.95; }
  .mp.picked .mp-flow:not(.on) { visibility:hidden; }
  .mp.picked .mp-flow.on { stroke:var(--gold); filter:drop-shadow(0 0 4px var(--gold)); }
  /* Pins: a glowing dot, a thin ring and a city label; click one to see only its talks */
  .mp-pin { position:absolute; width:0; height:0; padding:0; border:0; background:none; cursor:pointer; color:var(--gold); z-index:1; }
  .mp-pin.home { color:var(--teal-light); z-index:2; }
  .mp-pin .d { position:absolute; left:-5px; top:-5px; width:10px; height:10px; border-radius:50%; background:currentColor; box-shadow:0 0 12px currentColor; transition:scale 0.4s var(--ease), opacity 0.4s ease; }
  .mp-pin .d::before { content:''; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid currentColor; opacity:0.6; }
  .mp-pin .d::after { content:''; position:absolute; inset:-1px; border-radius:50%; border:2px solid currentColor; opacity:0; }
  .mp-pin .l { position:absolute; top:-12px; left:16px; white-space:nowrap; font:600 0.72rem/1 'DM Sans',sans-serif; color:var(--text-main); padding:0.4rem 0.55rem; border-radius:8px; background:color-mix(in srgb, var(--navy) 86%, transparent); border:1px solid var(--border); backdrop-filter:blur(6px); transition:border-color 0.3s ease, opacity 0.4s ease; }
  .mp-pin.left .l { left:auto; right:16px; }
  .mp-pin.above .l { top:auto; bottom:14px; left:0; transform:translateX(-50%); }
  .mp-pin.below .l { top:14px; left:0; transform:translateX(-50%); }
  @media (max-width:980px) { .mp-pin .l { display:none; } }
  .mp-pin .l em { font-style:normal; font-family:'DM Mono',monospace; color:var(--gold); margin-left:0.25rem; }
  .mp-pin:hover .d, .mp-pin.hot .d, .mp-pin.on .d { scale:1.4; }
  .mp-pin:hover .l, .mp-pin.hot .l, .mp-pin.on .l { border-color:var(--gold); }
  .mp-pin.home:hover .l, .mp-pin.home.hot .l, .mp-pin.home.on .l { border-color:var(--teal-light); }
  .mp-pin:focus-visible { outline:none; }
  .mp-pin:focus-visible .d { outline:2px solid currentColor; outline-offset:6px; }
  .mp.picked .mp-pin:not(.on) { opacity:0.45; }
  .mp-pin { transition:opacity 0.4s ease; }
  /* Pins and labels pop in after the lines have drawn */
  .has-reveal .mp:not(.in) .mp-pin .d { scale:0; }
  .has-reveal .mp:not(.in) .mp-pin .l { opacity:0; }
  .has-reveal .mp.in .mp-pin .d { animation:mp-pin-in 0.7s var(--ease) calc(var(--i) * 120ms + 700ms) backwards; }
  .has-reveal .mp.in .mp-pin .l { animation:mp-lbl-in 0.6s var(--ease) calc(var(--i) * 120ms + 900ms) backwards; }
  @keyframes mp-pin-in { from { scale:0; } }
  @keyframes mp-lbl-in { from { opacity:0; translate:0 6px; } }
  @keyframes mp-ping { 0% { opacity:0.8; scale:1; } 100% { opacity:0; scale:3.2; } }
  @keyframes mp-flow { from { stroke-dashoffset:7; } to { stroke-dashoffset:-100; } }
  @media (prefers-reduced-motion: no-preference) {
    .mp-pin .d::after { animation:mp-ping 2.8s var(--ease) calc(var(--i) * 0.35s + 1.6s) infinite; }
    .mp-flow { opacity:1; animation:mp-flow 3.4s linear calc(var(--i) * 0.5s + 2s) infinite both; }
  }
  /* City filter chips (also the way to pick a city on phones) */

  /* ===== MOTION & SMOOTHNESS ===== */
  @property --spot { syntax:'<number>'; inherits:false; initial-value:0; }
  @property --ring { syntax:'<angle>'; inherits:false; initial-value:0deg; }

  /* One smooth timing for everything that reveals, lifts, glows or tilts */
  .has-reveal .reveal { transition:opacity 0.9s var(--ease) var(--d,0ms), translate 0.9s var(--ease) var(--d,0ms), scale 0.9s var(--ease) var(--d,0ms), filter 0.9s var(--ease) var(--d,0ms), transform 0.35s var(--ease), border-color 0.3s ease, box-shadow 0.35s ease, background-color 0.3s ease, color 0.2s ease, --spot 0.4s ease; }
  .has-reveal .reveal.soft { filter:blur(10px); }
  .has-reveal .reveal.pop  { scale:0.94; }
  .has-reveal .reveal.in   { filter:none; scale:1; }

  /* Leaving page fades up and out before the next one arrives */
  .page.leaving { animation:none; opacity:0; transform:translateY(-12px); filter:blur(6px); transition:opacity 0.24s ease, transform 0.24s ease, filter 0.24s ease; }

  /* Cursor spotlight: cards light up softly where the mouse is */
  .spot { transition:border-color 0.3s ease, transform 0.35s var(--ease), box-shadow 0.35s ease, --spot 0.4s ease; background-image:radial-gradient(460px circle at var(--mx,50%) var(--my,50%), rgba(var(--spot-rgb), calc(0.14 * var(--spot))), transparent 45%); }
  .spot:hover { --spot:1; }

  /* Photo ring slowly turns, with a soft glow */
  .photo-frame { background:conic-gradient(from var(--ring), var(--teal), var(--gold), var(--teal-light), var(--teal)); box-shadow:0 0 42px rgba(var(--spot-rgb),0.18); animation:ring-spin 10s linear infinite; }
  @keyframes ring-spin { to { --ring:360deg; } }

  /* Section title lines draw themselves in */
  .has-reveal .section-title.reveal::after { transform:scaleX(0); transform-origin:left; transition:transform 1.3s var(--ease) calc(var(--d,0ms) + 150ms); }
  .has-reveal .section-title.reveal.in::after { transform:scaleX(1); }

  /* Experience timeline draws as you scroll; each dot lights up when the line reaches it */
  .tl-draw .ad::before { transform-origin:top; transform:scaleY(var(--tl,0)); transition:transform 0.2s linear; }
  .tl-draw .ad-dot { scale:0.5; opacity:0.35; transition:scale 0.5s var(--ease), opacity 0.5s ease; }

  .tag:hover { transform:translateY(-2px); }

/* -- BUILD NAV -- */
function buildNav() {
  const tabs = [
    { id:"about",        label:"About Me" },
    { id:"research",     label:"Research" },
    { id:"experience",   label:"Work Experience" },
    { id:"publications", label:"Publications", hidden: !SETTINGS.showPublications },
    { id:"awards",       label:"Awards & Honours" },
    { id:"professional", label:"Professional Activities" },
    { id:"talks",        label:"Talks & Presentations" },
    { id:"cv",           label:"CV" }
  ];
  const nav = document.getElementById("nav-tabs");
  tabs.forEach((t,i) => {
    if (t.hidden) return;
    const li = document.createElement("li");
    li.className = "nav-tab" + (i===0?" active":"");
    li.dataset.page = t.id;
    li.textContent = t.label;
    li.onclick = () => showPage(t.id, li);
    nav.appendChild(li);
  });

  // Sliding underline that glides to the selected tab
  const ind = document.createElement("li");
  ind.className = "nav-indicator";
  ind.setAttribute("aria-hidden", "true");
  nav.appendChild(ind);
  document.documentElement.classList.add("has-indicator");
  const snap = () => moveIndicator(nav.querySelector(".nav-tab.active"), true);
  snap();
  window.addEventListener("resize", snap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(snap);
}

function moveIndicator(tab, instant) {
  const ind = document.querySelector(".nav-indicator");
  if (!ind || !tab) return;
  if (instant) ind.style.transition = "none";
  ind.style.width = tab.offsetWidth + "px";
  ind.style.transform = `translateX(${tab.offsetLeft}px)`;
  if (instant) { void ind.offsetWidth; ind.style.transition = ""; }
}

let pageTimer = null;
function showPage(id, tab) {
  tab = tab || document.querySelector(`.nav-tab[data-page="${id}"]`);
  const el = document.getElementById("page-"+id);
  if (!el) return;
  const current = document.querySelector(".page.active");
  clearTimeout(pageTimer);
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.toggle("active", t === tab));
  if (tab) {
    moveIndicator(tab);
    tab.scrollIntoView({ block:"nearest", inline:"nearest", behavior:"smooth" });
  }
  if (el === current) { current.classList.remove("leaving"); return; }
  const swap = () => {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active", "leaving"));
    if (window.scrollY > 0) window.scrollTo({ top:0, behavior:"instant" });
    el.classList.add("active");
    updateScrollEffects();
  };
  // The current page fades up and out, then the new one glides in
  if (!current || matchMedia("(prefers-reduced-motion: reduce)").matches) { swap(); return; }
  current.classList.add("leaving");
  pageTimer = setTimeout(swap, 240);
}

/* -- SCROLL REVEAL -- */
const REVEAL_SELECTOR = [
  ".section-title", ".photo-frame", ".sp-lab", ".sp-mail", ".sp-loc", ".sp-h", ".sp-link",
  ".intro-greeting", ".intro-name", ".intro-title", ".intro-bio", ".bio-quote", ".tag",
  ".eb-row", ".nk-band", ".nl-year", ".nl-row", ".sub-section-label", ".ad-row",
  ".ph-sec", ".ph-f", ".ph-row", ".pub-empty", ".aw-tile",
  ".hx-lead", ".hx-head", ".hx", ".mp", ".ml-r", ".wk-head", ".wk-c", ".pass-wrap", ".gl-h", ".gl-r", ".gl-chips",
  ".r-eyebrow", ".r-headline", ".r-intro", ".rc-card"
].join(",");

function setupReveal() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const els = document.querySelectorAll(REVEAL_SELECTOR);
  const io = new IntersectionObserver(entries => {
    let n = 0;   // items arriving together are staggered, one after another
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.style.setProperty("--d", Math.min(n++, 6) * 80 + "ms");
      e.target.classList.add("in");
      io.unobserve(e.target);
    });
  }, { rootMargin:"0px 0px -6% 0px", threshold:0.06 });
  els.forEach(el => { el.classList.add("reveal"); io.observe(el); });
  // Headlines and pictures also come in from a soft blur; pictures grow slightly into place
  document.querySelectorAll(".intro-greeting, .intro-name, .intro-title, .section-title, .r-eyebrow, .r-headline, .r-intro, .r-art, .photo-frame").forEach(el => el.classList.add("soft"));
  document.querySelectorAll(".r-art, .photo-frame, .pass-wrap").forEach(el => el.classList.add("pop"));
  document.documentElement.classList.add("has-reveal");
}

/* -- NEWS TICKER: constant, readable speed (about 60 px per second) whatever the text length -- */
function sizeTicker() {
  const t = document.querySelector(".nk-track");
  if (!t) return;
  const half = t.scrollWidth / 2;
  if (half > 0) t.style.setProperty("--nk-dur", (half / 60).toFixed(1) + "s");
}

/* -- MOTION: cursor spotlight, 3D tilt, timeline drawing, background depth -- */
function setupMotion() {
  const root = document.documentElement;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;

  // Spotlight that follows the mouse on cards
  const SPOT = ".ph-f, .ph-row, .aw-tile, .ad-row, .ml-r, .wk-c, .gl-r, .rc-card, .sp-link";
  document.querySelectorAll(SPOT).forEach(el => el.classList.add("spot"));
  if (finePointer) {
    document.addEventListener("pointermove", e => {
      const c = e.target.closest && e.target.closest(".spot");
      if (!c) return;
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (e.clientX - r.left) + "px");
      c.style.setProperty("--my", (e.clientY - r.top) + "px");
    }, { passive:true });
  }

  // Gentle 3D tilt toward the cursor
  if (finePointer && !calm) {
    const TILT = [[".aw-tile", 7, "translateY(-4px)"], [".ph-f", 5, "translateY(-3px)"], [".r-art", 5, "scale(1.02)"], [".photo-frame", 10, "scale(1.03)"]];
    TILT.forEach(([sel, max, extra]) => document.querySelectorAll(sel).forEach(el => {
      el.addEventListener("pointermove", e => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = `perspective(900px) rotateX(${(-y * max).toFixed(2)}deg) rotateY(${(x * max).toFixed(2)}deg) ${extra}`;
      });
      el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    }));
  }

  if (!calm) root.classList.add("tl-draw");
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { updateScrollEffects(); ticking = false; });
  }, { passive:true });
  window.addEventListener("resize", updateScrollEffects);
  updateScrollEffects();
}

function updateScrollEffects() {
  const root = document.documentElement;
  const y = window.scrollY;
  const nav = document.querySelector("nav");
  if (nav) nav.classList.toggle("scrolled", y > 8);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // Background pattern drifts slower than the page, for a sense of depth
  root.style.setProperty("--py", Math.min(y * 0.12, innerHeight * 0.3).toFixed(1));
  // Timeline line grows to the 70% mark of the screen; dots light up as it passes
  const atBottom = y + innerHeight >= document.documentElement.scrollHeight - 4;
  const mark = atBottom ? innerHeight : innerHeight * 0.7;   // at the end of the page, light everything
  document.querySelectorAll(".page.active .ad").forEach(tl => {
    const r = tl.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (mark - r.top) / r.height));
    tl.style.setProperty("--tl", p.toFixed(4));
    tl.querySelectorAll(".ad-dot").forEach(d => d.classList.toggle("lit", d.getBoundingClientRect().top < mark));
  });
}

/* -- SIDE PANEL: copy email + live local time -- */
function setupSidePanel() {
  const btn = document.querySelector(".sp-cp");
  if (btn) btn.addEventListener("click", async () => {
    const text = btn.dataset.copy;
    try { await navigator.clipboard.writeText(text); }
    catch (e) {   // older browsers
      const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (_) {} t.remove();
    }
    btn.classList.add("done");
    clearTimeout(btn._t); btn._t = setTimeout(() => btn.classList.remove("done"), 1800);
  });
  const el = document.querySelector(".sp-time"), tz = PROFILE.contact.timezone;
  if (!el || !tz) return;
  let fmt;
  try { fmt = new Intl.DateTimeFormat("en-CA", { timeZone:tz, hour:"numeric", minute:"2-digit" }); } catch (e) { return; }
  const tick = () => { el.textContent = fmt.format(new Date()) + " local"; };
  tick(); setInterval(tick, 30000);
}

const MAP_W = 1000, MAP_H = 383, MAP_LAT0 = 80, MAP_LAT1 = -58;
const mapXY = (lon, lat) => [(lon + 180) / 360 * MAP_W, (MAP_LAT0 - lat) / (MAP_LAT0 - MAP_LAT1) * MAP_H];

function worldDotsPath() {
  const rows = WORLD_ROWS.split(","), cw = MAP_W / 180, rh = MAP_H / rows.length;
  let d = "";
  rows.forEach((hex, r) => {
    const y = ((r + 0.5) * rh).toFixed(1);
    [...hex].forEach((h, k) => {
      const v = parseInt(h, 16);
      for (let b = 0; b < 4; b++) if (v & (8 >> b)) d += `M${((k * 4 + b + 0.5) * cw).toFixed(1)} ${y}h0`;
    });
  });
  return d;
}

// True when a date like "Dec. 2026" or "2027" is later than this month (shows an "Upcoming" tag)
function isUpcoming(d) {
  const MON = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  const y = +((d || "").match(/\d{4}/) || [0])[0], m = MON[((d || "").toLowerCase().match(/[a-z]{3}/) || [""])[0]], now = new Date();
  return y > now.getFullYear() || (y === now.getFullYear() && m !== undefined && m > now.getMonth());
}

function setupTalks() {
  const page = document.getElementById("page-talks"), map = page && page.querySelector(".mp");
  if (!map) return;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pins = page.querySelectorAll(".mp-pin"), chips = page.querySelectorAll(".mp-chip");
  const rows = page.querySelectorAll(".ml-r"), arcs = page.querySelectorAll("[data-arc]");
  let current = "";

  // Pick a city: only its talks stay in the list, and its pin and line light up
  const pick = city => {
    current = city === current ? "" : city;
    map.classList.toggle("picked", !!current);
    pins.forEach(p => { const on = p.dataset.city === current; p.classList.toggle("on", on); p.setAttribute("aria-pressed", on); });
    chips.forEach(c => { const on = c.dataset.city === current; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); });
    arcs.forEach(a => a.classList.toggle("on", a.dataset.arc === current));
    let n = 0;
    rows.forEach(r => {
      const show = !current || r.dataset.city === current;
      r.hidden = !show;
      if (!show) return;
      r.classList.add("in");
      if (calm) return;
      r.classList.remove("flash"); void r.offsetWidth;
      r.style.setProperty("--fi", Math.min(n++, 8) * 55 + "ms");
      r.classList.add("flash");
    });
  };
  pins.forEach(p => p.addEventListener("click", () => pick(p.dataset.city)));
  chips.forEach(c => c.addEventListener("click", () => pick(c.dataset.city)));

  // Pointing at a talk makes its city's pin grow on the map
  rows.forEach(r => {
    const pin = [...pins].find(p => p.dataset.city === r.dataset.city);
    if (!pin) return;
    r.addEventListener("pointerenter", () => pin.classList.add("hot"));
    r.addEventListener("pointerleave", () => pin.classList.remove("hot"));
  });

  // The numbers count up when the map comes into view
  const nums = page.querySelectorAll(".mp-stats b");
  if (calm || !("IntersectionObserver" in window)) return;
  nums.forEach(b => b.textContent = "0");
  const io = new IntersectionObserver(entries => {
    if (!entries.some(e => e.isIntersecting)) return;
    io.disconnect();
    let t0 = 0;
    const step = now => {
      t0 = t0 || now;
      const k = Math.min(1, (now - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
      nums.forEach(b => b.textContent = Math.round(e * +b.dataset.n));
      if (k < 1) requestAnimationFrame(step);
    };
    setTimeout(() => requestAnimationFrame(step), 350);
  }, { threshold:0.3 });
  io.observe(page.querySelector(".mp-stats"));
}

  [...(PROFILE.name + PROFILE.contact.email)].forEach(ch => {
    const c = ch.charCodeAt(0), w = 1 + (c % 3);
    bars += `<rect x="${bx}" width="${w}" height="46"/>`;
    bx += w + 1 + ((c >> 2) % 3);
  });

  const hasPdf = !!(CV.cvUrl && CV.cvUrl.trim());
  const btn = hasPdf
    ? `<a class="pass-btn" href="${CV.cvUrl}" download>${I.dl} Download CV (PDF)</a>`
    : `<a class="pass-btn" href="mailto:${PROFILE.contact.email}?subject=${encodeURIComponent("CV request")}">${I.mail} Request my CV</a>`;

  const pass = `<div class="pass-wrap"><div class="pass"><div class="pass-shine"></div>
      <div class="pass-top"><b>SCP</b><span>Curriculum Vitae</span></div>
      <div class="pass-id"><div class="pass-ph">${initials(PROFILE.name)}${PROFILE.photo ? `<img src="${PROFILE.photo}" alt="" onerror="this.remove()">` : ""}</div>
        <div><div class="pass-n">${PROFILE.name}</div><div class="pass-t">${PROFILE.title}</div></div></div>
      <div class="pass-f">${CV.pass.map(f => `<div${/@/.test(f.value) || f.value.length > 24 ? ' class="wide"' : ""}><small>${f.label}</small><span>${f.value}</span></div>`).join("")}</div>
      <div class="pass-cut"><i></i><i></i></div>
      <div class="pass-bot"><svg class="pass-bars" viewBox="0 0 ${bx} 46" preserveAspectRatio="none" fill="#fff" aria-hidden="true">${bars}</svg>${btn}</div>
    </div></div>`;

  const edu = EDUCATION.map(e => row("#0891b2", "🎓", e.degree, `${e.school}${e.badge ? ` · <em>🥇 ${e.badge}</em>` : ""}`, e.period)).join("");
  const R = CV.recent || { academic:4, industry:1 };
  const exp = [
    ...EXPERIENCE.academic.slice(0, R.academic).map(e => row("#7c3aed", "🔬", e.role, orgShort(e.org), e.period)),
    ...EXPERIENCE.industry.slice(0, R.industry).map(e => row("#059669", "⚡", e.role, orgShort(e.org), e.period))
  ].join("") + `<button type="button" class="gl-r gl-more" onclick="showPage('experience')"><div class="gl-i">→</div><div>See all experience</div><div class="gl-e">${I.chev}</div></button>`;
  const refs = PROFESSIONAL.references.map(r => row("linear-gradient(135deg,var(--teal),#7c3aed)", initials(r.name), r.name, `${r.note} · ${tidy(r.role)}`,
    `<a class="gl-act" href="mailto:${r.email}" title="Email ${r.email}">${I.mail}</a><button type="button" class="gl-act" data-copy="${r.email}" title="Copy ${r.email}">${I.copy}</button>`)).join("");

  document.getElementById("page-cv").innerHTML = `
  <div class="container">
    <h2 class="section-title" style="margin-bottom:1.6rem;">Curriculum Vitae</h2>
    <div class="wl">${pass}
      <div>
        <div class="gl-h">Education</div><div class="gl">${edu}</div>
        <div class="gl-h">Recent experience</div><div class="gl">${exp}</div>
        <div class="gl-h">Research interests</div><div class="gl gl-chips">${PROFILE.research_tags.map(t => `<span class="cv-chip">${t}</span>`).join("")}</div>
        <div class="gl-h">References</div><div class="gl">${refs}</div>
      </div>
    </div>
  </div>`;
}

function setupCV() {
  const pass = document.querySelector("#page-cv .pass");
  if (!pass) return;
  // The card tilts toward the mouse and catches the light
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (fine && !calm) {
    pass.addEventListener("pointermove", e => {
      const r = pass.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      pass.classList.add("live");
      pass.style.setProperty("--ry", ((x - 0.5) * 16).toFixed(2) + "deg");
      pass.style.setProperty("--rx", ((0.5 - y) * 12).toFixed(2) + "deg");
      pass.style.setProperty("--gx", (x * 100).toFixed(1) + "%");
      pass.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
    });
    pass.addEventListener("pointerleave", () => {
      pass.classList.remove("live");
      ["--ry", "--rx", "--gx", "--gy"].forEach(p => pass.style.removeProperty(p));
    });
  }
  // Copy a reference's email
  document.querySelectorAll("#page-cv [data-copy]").forEach(b => b.addEventListener("click", () => {
    const done = () => { b.classList.add("done"); setTimeout(() => b.classList.remove("done"), 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, done); else done();
  }));
}

/* -- MOVING BACKGROUND: satellite nodes drift slowly; nearby nodes link up, and small signals travel along the links -- */
function setupNetworkBg() {
  const cv = document.createElement("canvas");
  cv.id = "bg-net";
  cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv);
  const ctx = cv.getContext("2d");
  if (!ctx) return;
  const root = document.documentElement;
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const LINK = 125;              // nodes closer than this (px) are joined by a line
  const DENSITY = 7500;          // one node per this many square pixels of screen
  const PAD = 30;                // nodes wrap around just outside the screen edges
  let W = 0, H = 0, nodes = [], pulses = [], rgb = "0,180,216", light = false;
  let last = 0, lastDraw = 0, nextPulse = 0, frame = 0;

  const readTheme = () => {
    light = root.dataset.theme === "light";
    rgb = getComputedStyle(root).getPropertyValue("--spot-rgb").trim() || "0,180,216";
  };
  const make = () => {
    const sat = Math.random() < 0.08;                          // a few brighter "satellites" that move a little faster
    const ang = Math.random() * Math.PI * 2;
    const speed = sat ? 0.010 + Math.random() * 0.006 : 0.0025 + Math.random() * 0.004;   // px per millisecond
    return { x:Math.random() * W, y:Math.random() * H, vx:Math.cos(ang) * speed, vy:Math.sin(ang) * speed, sat };
  };
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const want = Math.max(40, Math.round(W * H / DENSITY));
    while (nodes.length < want) nodes.push(make());
    nodes.length = want;
    if (calm.matches) draw(0, true);
  };
  const wrap = (v, size) => ((v + PAD) % (size + 2 * PAD) + (size + 2 * PAD)) % (size + 2 * PAD) - PAD;

  function draw(t, force) {
    if (!force) {
      frame = requestAnimationFrame(draw);
      if (t - lastDraw < 33) return;                            // about 30 frames a second is plenty for slow motion
    }
    const dt = last ? Math.min(t - last, 100) : 0;
    last = t; lastDraw = t;
    const moving = !calm.matches;
    const py = moving ? parseFloat(root.style.getPropertyValue("--py")) || 0 : 0;   // same gentle parallax as before

    // Move the nodes and work out where they are on screen
    const P = nodes.map(n => {
      if (moving) { n.x = wrap(n.x + n.vx * dt, W); n.y = wrap(n.y + n.vy * dt, H); }
      return { x:n.x, y:wrap(n.y - py, H), sat:n.sat };
    });

    ctx.clearRect(0, 0, W, H);
    // Links between nearby nodes, fading with distance
    const maxA = light ? 0.16 : 0.15, L2 = LINK * LINK, links = [];
    ctx.lineWidth = 1;
    for (let i = 0; i < P.length; i++) {
      for (let j = i + 1; j < P.length; j++) {
        const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d2 = dx * dx + dy * dy;
        if (d2 > L2) continue;
        const sat = P[i].sat || P[j].sat;
        const a = (1 - Math.sqrt(d2) / LINK) * maxA * (sat ? 1.6 : 1);
        ctx.strokeStyle = `rgba(${rgb},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
        if (sat) links.push([i, j]);
      }
    }
    // Nodes; satellites get a soft ring
    P.forEach(n => {
      ctx.fillStyle = `rgba(${rgb},${n.sat ? (light ? 0.6 : 0.65) : (light ? 0.3 : 0.32)})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.sat ? 2.3 : 1.6, 0, Math.PI * 2); ctx.fill();
      if (n.sat) {
        ctx.strokeStyle = `rgba(${rgb},${light ? 0.22 : 0.2})`;
        ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, Math.PI * 2); ctx.stroke();
      }
    });
    if (!moving) return;

    // Now and then a small signal travels from a satellite along one of its links
    if (t > nextPulse && links.length) {
      const [i, j] = links[Math.floor(Math.random() * links.length)];
      const fromSat = nodes[i].sat;
      pulses.push({ a:fromSat ? nodes[i] : nodes[j], b:fromSat ? nodes[j] : nodes[i], t0:t });
      nextPulse = t + 700 + Math.random() * 1300;
    }
    pulses = pulses.filter(p => t - p.t0 < 1800);
    pulses.forEach(p => {
      const k = (t - p.t0) / 1800, ax = p.a.x, ay = wrap(p.a.y - py, H), bx = p.b.x, by = wrap(p.b.y - py, H);
      if ((ax - bx) ** 2 + (ay - by) ** 2 > L2 * 1.2) return;   // the two nodes have drifted apart
      const x = ax + (bx - ax) * k, y = ay + (by - ay) * k, a = Math.sin(k * Math.PI);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 7);
      g.addColorStop(0, `rgba(${rgb},${(0.65 * a).toFixed(3)})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
    });
  }

  readTheme();
  resize();
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  new MutationObserver(() => { readTheme(); if (calm.matches) draw(0, true); }).observe(root, { attributes:true, attributeFilter:["data-theme"] });
  const start = () => { cancelAnimationFrame(frame); last = 0; if (calm.matches) draw(0, true); else frame = requestAnimationFrame(draw); };
  if (calm.addEventListener) calm.addEventListener("change", start);
  start();
}

/* -- LIGHT / DARK SWITCH -- */
function setupThemeSwitch() {
  const root = document.documentElement;
  const btn  = document.getElementById("theme-switch");
  if (!btn) return;
  const sync = () => {
    const light = root.getAttribute("data-theme") === "light";
    btn.setAttribute("aria-checked", light ? "true" : "false");
    btn.title = light ? "Switch to dark mode" : "Switch to light mode";
  };
  btn.addEventListener("click", () => {
    const goLight = root.getAttribute("data-theme") !== "light";
    const apply = () => {
      if (goLight) root.setAttribute("data-theme", "light");
      else root.removeAttribute("data-theme");
      try { localStorage.setItem("scp-theme", goLight ? "light" : "dark"); } catch (e) {}
      sync();
    };
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!document.startViewTransition || calm) { apply(); return; }
    // The new theme spreads out in a circle from the switch
    const r = btn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const t = document.startViewTransition(apply);
    t.ready.then(() => {
      root.animate(
        { clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration:700, easing:"cubic-bezier(.2,.7,.2,1)", pseudoElement:"::view-transition-new(root)" }
      );
    }).catch(() => {});
  });
  sync();
}

  try {
    setupThemeSwitch();
    buildNav();
    buildAbout();

    buildAwards();
    buildProfessional();
    buildTalks();
    buildCV();
    setupSidePanel();

    setupMotion();
    setupNetworkBg();
    sizeTicker();

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeTicker);
  } catch(e) {
    document.body.innerHTML += '<div style="color:red;padding:2rem;font-family:monospace;">JS Error: ' + e.message + '<br>' + e.stack + '</div>';
  }
});
